<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2140">
<title>수면 베개</title>
<style>
  :root {
    --night: #1B2140;
    --surface: #262D52;
    --line: #3A4266;
    --moon: #ECE6D3;
    --dim: #A9A6B8;
    --lavender: #9D94D6;
    --amber: #E6AE5C;
    --alert: #E07C7C;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--moon);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 8px; }
  header h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .link.on .dot { background: var(--lavender); box-shadow: 0 0 0 4px rgba(157,148,214,0.25); }
  .link.on { color: var(--moon); }

  .night { padding: 28px 0 20px; }
  .night .state { color: var(--dim); font-size: 0.95rem; margin: 0 0 4px; }
  .night .clock { font-size: 3.4rem; font-weight: 300; letter-spacing: -0.03em; margin: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .night .since { color: var(--dim); font-size: 0.9rem; margin: 6px 0 0; }

  .sky { position: relative; height: 92px; margin: 8px 0 6px; border-bottom: 1px solid var(--line); }
  .sky .tick { position: absolute; bottom: 0; width: 2px; border-radius: 1px; transform: translateX(-1px); }
  .sky .tick.down { height: 34px; background: var(--lavender); }
  .sky .tick.up { height: 76px; background: var(--amber); }
  .sky .empty { position: absolute; inset: 0; display: flex; align-items: center; color: var(--dim); font-size: 0.9rem; }
  .sky-ends { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 0.85rem; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin: 24px 0; }
  .fact { background: var(--surface); padding: 14px 14px 12px; }
  .fact b { display: block; font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fact span { color: var(--dim); font-size: 0.82rem; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-size: 1rem; border: 0; border-radius: 12px; padding: 14px 12px;
    background: var(--surface); color: var(--moon); cursor: pointer;
  }
  button.primary { background: var(--lavender); color: var(--night); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .wide { grid-column: 1 / -1; }

  .notice { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(224,124,124,0.12); color: var(--alert); font-size: 0.9rem; display: none; }
  .notice.show { display: block; }

  h2 { font-size: 0.95rem; font-weight: 600; margin: 32px 0 8px; }
  ol.log { list-style: none; margin: 0; padding: 0; }
  ol.log li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
  ol.log time { color: var(--dim); font-variant-numeric: tabular-nums; }
  ol.log .up { color: var(--amber); }
  ol.log .down { color: var(--lavender); }
  .muted { color: var(--dim); font-size: 0.9rem; }
  .clear { margin-top: 20px; background: transparent; color: var(--dim); padding: 8px 0; }

  @media (prefers-reduced-motion: no-preference) {
    .sky .tick.fresh { animation: rise 0.6s ease-out; }
    @keyframes rise { from { transform: translateX(-1px) scaleY(0); transform-origin: bottom; } to { transform: translateX(-1px) scaleY(1); } }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>수면 베개</h1>
    <span class="link" id="link"><span class="dot"></span><span id="linkText">연결 안 됨</span></span>
  </header>

  <section class="night">
    <p class="state" id="state">기록 시작 전</p>
    <p class="clock" id="clock">0:00</p>
    <p class="since" id="since">수면 시작을 누르면 시간이 흘러요</p>
  </section>

  <div class="sky" id="sky"><div class="empty">아직 감지된 움직임이 없어요</div></div>
  <div class="sky-ends"><span id="skyStart">시작</span><span id="skyEnd">지금</span></div>
  <div class="legend">
    <span><i style="background:var(--lavender)"></i>머리를 눕힘</span>
    <span><i style="background:var(--amber)"></i>머리를 듦</span>
  </div>

  <div class="facts">
    <div class="fact"><b id="count">0</b><span>감지된 움직임</span></div>
    <div class="fact"><b id="rate">–</b><span>시간당 움직임</span></div>
    <div class="fact"><b id="head">–</b><span>지금 머리</span></div>
  </div>

  <div class="actions">
    <button class="primary wide" id="connectBtn">베개 연결하기</button>
    <button id="startBtn">수면 시작</button>
    <button id="stopBtn" disabled>수면 끝내기</button>
  </div>
  <p class="notice" id="notice"></p>

  <h2>움직임 기록</h2>
  <ol class="log" id="log"></ol>
  <p class="muted" id="logEmpty">베개를 연결하고 누워 보세요. 움직임이 감지되면 여기에 쌓여요.</p>
  <button class="clear" id="clearBtn">기록 지우기</button>
</main>

<script>
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
  const KEY = 'sleepPillow.v1';

  let data = load();
  let device = null;
  let freshIndex = -1;

  const $ = id => document.getElementById(id);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { start: null, end: null, events: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  function showNotice(msg) {
    const n = $('notice');
    n.textContent = msg;
    n.classList.toggle('show', !!msg);
  }

  function fmtTime(t) {
    return new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function fmtShort(t) {
    return new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDuration(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }

  function setLink(on, text) {
    $('link').classList.toggle('on', on);
    $('linkText').textContent = text;
    $('connectBtn').textContent = on ? '연결됨' : '베개 연결하기';
    $('connectBtn').disabled = on;
  }

  async function connect() {
    showNotice('');
    if (!navigator.bluetooth) {
      showNotice('이 브라우저는 블루투스를 쓸 수 없어요. 아이폰에서는 Bluefy 앱으로 이 페이지를 열어 주세요.');
      return;
    }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
      device.addEventListener('gattserverdisconnected', () => {
        setLink(false, '연결 끊김');
        showNotice('베개와 연결이 끊겼어요. ESP32 전원과 거리를 확인하고 다시 연결해 주세요.');
      });
      setLink(false, '연결 중…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const ch = await service.getCharacteristic(CHAR_UUID);
      await ch.startNotifications();
      ch.addEventListener('characteristicvaluechanged', onValue);
      setLink(true, '연결됨');
    } catch (e) {
      setLink(false, '연결 안 됨');
      if (e && e.name === 'NotFoundError') return; // 사용자가 선택 창을 닫음
      showNotice('연결하지 못했어요: ' + (e && e.message ? e.message : e) + '. ESP32가 켜져 있는지 확인해 주세요.');
    }
  }

  function onValue(e) {
    const text = new TextDecoder().decode(e.target.value).trim();
    const parts = text.split(',');
    if (parts[0].toUpperCase() !== 'EVENT') return;
    const dir = (parts[3] || '').trim().toUpperCase();
    if (!data.start || data.end) startSession(); // 기록 중이 아니면 자동으로 시작
    data.events.push({ t: Date.now(), dir: dir === 'UP' ? 'UP' : 'DOWN' });
    freshIndex = data.events.length - 1;
    save();
    render();
  }

  function startSession() {
    data = { start: Date.now(), end: null, events: [] };
    save();
    render();
  }
  function stopSession() {
    if (!data.start || data.end) return;
    data.end = Date.now();
    save();
    render();
  }

  function render() {
    const now = Date.now();
    const running = data.start && !data.end;
    const endT = data.end || now;

    $('state').textContent = running ? '수면 기록 중' : (data.end ? '기록이 끝났어요' : '기록 시작 전');
    $('clock').textContent = data.start ? fmtDuration(endT - data.start) : '0:00';
    $('since').textContent = data.start
      ? fmtShort(data.start) + '부터' + (data.end ? ' ' + fmtShort(data.end) + '까지' : '')
      : '수면 시작을 누르면 시간이 흘러요';
    $('startBtn').disabled = !!running;
    $('stopBtn').disabled = !running;

    const n = data.events.length;
    $('count').textContent = n;
    const hours = data.start ? (endT - data.start) / 3600000 : 0;
    $('rate').textContent = hours >= 0.05 ? (n / hours).toFixed(1) : '–';
    const last = data.events[n - 1];
    $('head').textContent = last ? (last.dir === 'DOWN' ? '누움' : '들림') : '–';

    // 밤하늘 띠(타임라인)
    const sky = $('sky');
    sky.innerHTML = '';
    if (!data.start || n === 0) {
      sky.innerHTML = '<div class="empty">아직 감지된 움직임이 없어요</div>';
    } else {
      const span = Math.max(endT - data.start, 1);
      data.events.forEach((ev, i) => {
        const d = document.createElement('div');
        d.className = 'tick ' + (ev.dir === 'UP' ? 'up' : 'down') + (i === freshIndex ? ' fresh' : '');
        d.style.left = Math.min(100, Math.max(0, (ev.t - data.start) / span * 100)) + '%';
        sky.appendChild(d);
      });
    }
    $('skyStart').textContent = data.start ? fmtShort(data.start) : '시작';
    $('skyEnd').textContent = data.end ? fmtShort(data.end) : '지금';

    // 기록 목록 (최근 것이 위)
    const log = $('log');
    log.innerHTML = '';
    data.events.slice().reverse().slice(0, 100).forEach(ev => {
      const li = document.createElement('li');
      const what = document.createElement('span');
      what.className = ev.dir === 'UP' ? 'up' : 'down';
      what.textContent = ev.dir === 'UP' ? '머리를 듦' : '머리를 눕힘';
      const tm = document.createElement('time');
      tm.textContent = fmtTime(ev.t);
      li.append(what, tm);
      log.appendChild(li);
    });
    $('logEmpty').style.display = n ? 'none' : 'block';
    freshIndex = -1;
  }

  $('connectBtn').addEventListener('click', connect);
  $('startBtn').addEventListener('click', startSession);
  $('stopBtn').addEventListener('click', stopSession);
  $('clearBtn').addEventListener('click', () => {
    if (confirm('지금까지의 수면 기록을 모두 지울까요?')) {
      data = { start: null, end: null, events: [] };
      save();
      render();
    }
  });

  render();
  setInterval(render, 30000); // 30초마다 시간 갱신
</script>
</body>
</html>
