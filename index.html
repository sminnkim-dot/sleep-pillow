<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2140">
<title>수면 베개</title>
<style>
  :root {
    --night: #1B2140;
    --surface: #262D52;
    --line: #3A4266;
    --moon: #ECE6D3;
    --dim: #A9A6B8;
    --sleep: #9D94D6;
    --toss: #E6AE5C;
    --away: #E07C7C;
    --before: #4A5280;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--moon);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 8px; }
  header h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .link.on .dot { background: var(--sleep); box-shadow: 0 0 0 4px rgba(157,148,214,0.25); }
  .link.on { color: var(--moon); }

  .night { padding: 24px 0 16px; }
  .night .state { color: var(--dim); font-size: 0.95rem; margin: 0 0 4px; }
  .night .clock { font-size: 3.4rem; font-weight: 300; letter-spacing: -0.03em; margin: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .night .since { color: var(--dim); font-size: 0.9rem; margin: 6px 0 0; }

  .band { display: flex; height: 44px; border-radius: 10px; overflow: hidden; background: var(--surface); margin-top: 8px; }
  .band div { flex: 1 1 0; min-width: 0; }
  .band .sleep { background: var(--sleep); }
  .band .toss { background: var(--toss); }
  .band .away { background: var(--away); }
  .band .before { background: var(--before); }
  .band .empty { display: flex; align-items: center; padding: 0 14px; color: var(--dim); font-size: 0.9rem; flex: 1; }
  .band-ends { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 0.85rem; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .report { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin: 24px 0 8px; }
  .fact { background: var(--surface); padding: 14px 14px 12px; }
  .fact b { display: block; font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fact span { color: var(--dim); font-size: 0.82rem; }
  .caveat { color: var(--dim); font-size: 0.8rem; margin: 0 0 20px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-size: 1rem; border: 0; border-radius: 12px; padding: 14px 12px;
    background: var(--surface); color: var(--moon); cursor: pointer;
  }
  button.primary { background: var(--sleep); color: var(--night); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--toss); outline-offset: 2px; }
  .wide { grid-column: 1 / -1; }

  .demo { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 0; font-size: 0.9rem; }
  .demo input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--sleep); }
  .demo small { display: block; color: var(--dim); font-size: 0.8rem; }

  .notice { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(224,124,124,0.12); color: var(--away); font-size: 0.9rem; display: none; }
  .notice.show { display: block; }

  h2 { font-size: 0.95rem; font-weight: 600; margin: 32px 0 8px; }
  ol.log { list-style: none; margin: 0; padding: 0; }
  ol.log li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
  ol.log time { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  ol.log .toss { color: var(--toss); }
  ol.log .away { color: var(--away); }
  ol.log .now { color: var(--moon); }
  ol.log em { font-style: normal; color: var(--dim); }
  .muted { color: var(--dim); font-size: 0.9rem; }
  .clear { margin-top: 20px; background: transparent; color: var(--dim); padding: 8px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>수면 베개</h1>
    <span class="link" id="link"><span class="dot"></span><span id="linkText">연결 안 됨</span></span>
  </header>

  <section class="night">
    <p class="state" id="state">기록 시작 전</p>
    <p class="clock" id="clock">0:00</p>
    <p class="since" id="since">수면 시작을 누르면 시간이 흘러요</p>
  </section>

  <div class="band" id="band"><div class="empty">수면 기록이 여기에 그려져요</div></div>
  <div class="band-ends"><span id="bandStart">누운 시각</span><span id="bandEnd">지금</span></div>
  <div class="legend">
    <span><i style="background:var(--sleep)"></i>잠</span>
    <span><i style="background:var(--toss)"></i>뒤척임</span>
    <span><i style="background:var(--away)"></i>깸(베개에서 벗어남)</span>
    <span><i style="background:var(--before)"></i>잠들기 전</span>
  </div>

  <div class="report">
    <div class="fact"><b id="onset">–</b><span>잠든 시각</span></div>
    <div class="fact"><b id="latency">–</b><span>잠드는 데 걸린 시간</span></div>
    <div class="fact"><b id="total">–</b><span>총 수면 시간</span></div>
    <div class="fact"><b id="eff">–</b><span>수면 효율</span></div>
    <div class="fact"><b id="tosses">0회</b><span>뒤척임</span></div>
    <div class="fact"><b id="wakes">0회</b><span>중간에 깸</span></div>
  </div>
  <p class="caveat">움직임으로 추정한 값이에요. 깊은 잠과 렘수면은 구분하지 못해요.</p>

  <div class="actions">
    <button class="primary wide" id="connectBtn">베개 연결하기</button>
    <button id="startBtn">수면 시작</button>
    <button id="stopBtn" disabled>수면 끝내기</button>
  </div>
  <label class="demo">
    <input type="checkbox" id="demoBox">
    <span>시연 모드
      <small id="demoText"></small>
    </span>
  </label>
  <p class="notice" id="notice"></p>

  <h2>움직임 기록</h2>
  <ol class="log" id="log"></ol>
  <p class="muted" id="logEmpty">베개를 연결하고 누워 보세요. 머리를 들었다 눕히면 여기에 쌓여요.</p>
  <button class="clear" id="clearBtn">기록 지우기</button>
</main>

<script>
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
  const KEY = 'sleepPillow.v2';
  const DEMO_KEY = 'sleepPillow.demo';

  // 판단 기준 (밀리초)
  // tossMax: 머리를 이 시간 안에 다시 눕히면 "뒤척임", 더 길면 "깸(베개에서 벗어남)"
  // quietMin: 머리를 눕힌 채 이 시간 이상 조용하면 그 시작을 "잠든 시각"으로 봄
  const NORMAL = { tossMax: 60 * 1000, quietMin: 15 * 60 * 1000, epoch: 60 * 1000 };
  const DEMO   = { tossMax: 5 * 1000,  quietMin: 20 * 1000,      epoch: 2 * 1000 };

  let data = load();
  let demo = localStorage.getItem(DEMO_KEY) === '1';
  const $ = id => document.getElementById(id);
  const cfg = () => (demo ? DEMO : NORMAL);

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { start: null, end: null, events: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  // ---------- 시간 표시 ----------
  const fmtTime = t => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const fmtShort = t => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  function fmtClock(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }
  function fmtDur(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + '초';
    const m = Math.floor(s / 60), h = Math.floor(m / 60);
    if (h === 0) return m + '분' + (m < 10 && s % 60 ? ' ' + (s % 60) + '초' : '');
    return h + '시간 ' + (m % 60) + '분';
  }

  // ---------- 블루투스 ----------
  function showNotice(msg) { const n = $('notice'); n.textContent = msg; n.classList.toggle('show', !!msg); }
  function setLink(on, text) {
    $('link').classList.toggle('on', on);
    $('linkText').textContent = text;
    $('connectBtn').textContent = on ? '연결됨' : '베개 연결하기';
    $('connectBtn').disabled = on;
  }
  async function connect() {
    showNotice('');
    if (!navigator.bluetooth) {
      showNotice('이 브라우저는 블루투스를 쓸 수 없어요. 아이폰에서는 Bluefy 앱으로 이 페이지를 열어 주세요.');
      return;
    }
    try {
      const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
      device.addEventListener('gattserverdisconnected', () => {
        setLink(false, '연결 끊김');
        showNotice('베개와 연결이 끊겼어요. ESP32 전원과 거리를 확인하고 다시 연결해 주세요.');
      });
      setLink(false, '연결 중…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const ch = await service.getCharacteristic(CHAR_UUID);
      await ch.startNotifications();
      ch.addEventListener('characteristicvaluechanged', onValue);
      setLink(true, '연결됨');
    } catch (e) {
      setLink(false, '연결 안 됨');
      if (e && e.name === 'NotFoundError') return;
      showNotice('연결하지 못했어요: ' + (e && e.message ? e.message : e) + '. ESP32가 켜져 있는지 확인해 주세요.');
    }
  }
  function onValue(e) {
    const parts = new TextDecoder().decode(e.target.value).trim().split(',');
    if (parts[0].toUpperCase() !== 'EVENT') return;
    const dir = (parts[3] || '').trim().toUpperCase() === 'UP' ? 'UP' : 'DOWN';
    if (!data.start || data.end) startSession();
    data.events.push({ t: Date.now(), dir });
    save();
    render();
  }

  // ---------- 수면 분석 ----------
  // 1) 들림(UP) → 누움(DOWN)을 짝지어 "머리를 든 구간"을 만듦
  // 2) 짧으면 뒤척임, 길면 깸
  // 3) 머리를 눕힌 채 조용한 구간이 quietMin 이상인 첫 시점 = 잠든 시각
  function analyze(now) {
    const c = cfg();
    const start = data.start, end = data.end || now;
    const lifts = [];
    let up = null;
    for (const ev of data.events) {
      if (ev.dir === 'UP') { if (up === null) up = ev.t; }
      else if (up !== null) { lifts.push({ t0: up, t1: ev.t }); up = null; }
    }
    if (up !== null) lifts.push({ t0: up, t1: null });
    for (const L of lifts) {
      L.dur = (L.t1 || end) - L.t0;
      L.kind = L.dur <= c.tossMax ? (L.t1 === null ? 'now' : 'toss') : 'away';
    }

    // 머리를 눕힌 구간들 (들린 구간 사이사이)
    const downs = [];
    let a = start;
    for (const L of lifts) { if (L.t0 > a) downs.push([a, L.t0]); a = L.t1 === null ? end : L.t1; }
    if (a < end) downs.push([a, end]);
    const quiet = downs.find(([x, y]) => y - x >= c.quietMin);
    const onset = quiet ? quiet[0] : null;

    const tosses = lifts.filter(L => L.kind === 'toss').length;
    const aways = onset === null ? [] : lifts.filter(L => L.kind === 'away' && L.t0 >= onset);
    const awayTime = aways.reduce((s, L) => s + L.dur, 0);
    const total = onset === null ? 0 : Math.max(0, end - onset - awayTime);
    const eff = end > start ? total / (end - start) : 0;
    return { start, end, lifts, onset, tosses, aways, awayTime, total, eff };
  }

  function epochs(A) {
    const span = A.end - A.start;
    if (span <= 0) return [];
    const len = Math.max(cfg().epoch, span / 240); // 칸이 너무 많아지지 않게
    const n = Math.max(1, Math.ceil(span / len));
    const out = [];
    for (let i = 0; i < n; i++) {
      const e0 = A.start + i * len, e1 = Math.min(A.end, e0 + len);
      let kind;
      const overlap = L => L.t0 < e1 && (L.t1 || A.end) > e0;
      if (A.lifts.some(L => L.kind === 'away' && overlap(L))) kind = 'away';
      else if (A.lifts.some(L => (L.kind === 'toss' || L.kind === 'now') && overlap(L))) kind = 'toss';
      else if (A.onset === null || e1 <= A.onset) kind = 'before';
      else kind = 'sleep';
      out.push(kind);
    }
    return out;
  }

  // ---------- 화면 ----------
  function startSession() { data = { start: Date.now(), end: null, events: [] }; save(); render(); }
  function stopSession() { if (data.start && !data.end) { data.end = Date.now(); save(); render(); } }

  function render() {
    const now = Date.now();
    const running = data.start && !data.end;
    $('startBtn').disabled = !!running;
    $('stopBtn').disabled = !running;
    $('demoText').textContent = demo
      ? '기준을 짧게 했어요: 5초 안에 다시 누우면 뒤척임, 더 길면 깸, 20초 조용하면 잠든 것으로 봐요.'
      : '켜면 기준 시간이 짧아져서 몇 분 안에 결과를 볼 수 있어요. 실제 수면은 끈 상태로 기록하세요.';

    if (!data.start) {
      $('state').textContent = '기록 시작 전';
      $('clock').textContent = '0:00';
      $('since').textContent = '수면 시작을 누르면 시간이 흘러요';
      $('band').innerHTML = '<div class="empty">수면 기록이 여기에 그려져요</div>';
      $('bandStart').textContent = '누운 시각'; $('bandEnd').textContent = '지금';
      ['onset', 'latency', 'total', 'eff'].forEach(id => $(id).textContent = '–');
      $('tosses').textContent = '0회'; $('wakes').textContent = '0회';
      $('log').innerHTML = ''; $('logEmpty').style.display = 'block';
      return;
    }

    const A = analyze(now);
    $('state').textContent = running ? (A.onset ? '잠든 상태로 기록 중' : '잠들기를 기다리는 중') : '아침 리포트';
    $('clock').textContent = fmtClock(A.end - A.start);
    $('since').textContent = fmtShort(A.start) + '부터' + (data.end ? ' ' + fmtShort(data.end) + '까지' : ' 누워 있어요');

    const band = $('band');
    band.innerHTML = '';
    epochs(A).forEach(k => { const d = document.createElement('div'); d.className = k; band.appendChild(d); });
    $('bandStart').textContent = fmtShort(A.start);
    $('bandEnd').textContent = data.end ? fmtShort(data.end) : '지금';

    $('onset').textContent = A.onset ? fmtShort(A.onset) : '아직';
    $('latency').textContent = A.onset ? fmtDur(A.onset - A.start) : '–';
    $('total').textContent = A.onset ? fmtDur(A.total) : '–';
    $('eff').textContent = A.onset ? Math.round(A.eff * 100) + '%' : '–';
    $('tosses').textContent = A.tosses + '회';
    $('wakes').textContent = A.aways.length + '회' + (A.aways.length ? ' · ' + fmtDur(A.awayTime) : '');

    const log = $('log');
    log.innerHTML = '';
    A.lifts.slice().reverse().slice(0, 100).forEach(L => {
      const li = document.createElement('li');
      const what = document.createElement('span');
      if (L.t1 === null) {
        what.className = 'now';
        what.innerHTML = '머리를 든 상태 <em>' + fmtDur(L.dur) + '째</em>';
      } else if (L.kind === 'toss') {
        what.className = 'toss';
        what.innerHTML = '뒤척임 <em>' + fmtDur(L.dur) + '</em>';
      } else {
        what.className = 'away';
        what.innerHTML = '베개에서 벗어남 <em>' + fmtDur(L.dur) + '</em>';
      }
      const tm = document.createElement('time');
      tm.textContent = fmtTime(L.t0);
      li.append(what, tm);
      log.appendChild(li);
    });
    $('logEmpty').style.display = A.lifts.length ? 'none' : 'block';
  }

  $('connectBtn').addEventListener('click', connect);
  $('startBtn').addEventListener('click', startSession);
  $('stopBtn').addEventListener('click', stopSession);
  $('demoBox').checked = demo;
  $('demoBox').addEventListener('change', e => {
    demo = e.target.checked;
    try { localStorage.setItem(DEMO_KEY, demo ? '1' : '0'); } catch (err) {}
    render();
  });
  $('clearBtn').addEventListener('click', () => {
    if (confirm('지금까지의 수면 기록을 모두 지울까요?')) { data = { start: null, end: null, events: [] }; save(); render(); }
  });

  render();
  setInterval(render, 2000);
</script>
</body>
</html>
